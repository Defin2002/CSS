<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Profile Section</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body{
      background-color:#f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
    }

    .profile-section{
      background-color:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .profile-img{
      width:100%;
      max-width:250px;
      border-radius:50%;
      display:block;
      margin:auto;
    }

    .bio{
      display:flex;
      flex-direction:column;
      justify-content:center;
      height:100%;
    }

  </style>
</head>
<body>

  <!-- Container -->
  <div class="container py-5">

    <!-- Row -->
    <div class="row profile-section align-items-center">

      <!-- Left Column -->
      <div class="col-md-4 text-center mb-4 mb-md-0">

        <img
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e"
          alt="Profile Image"
          class="profile-img"
        >

      </div>

      <!-- Right Column -->
      <div class="col-md-8">

        <div class="bio">

          <h1>John Doe</h1>

          <p>
            Hello! I am a web developer passionate about creating
            responsive and user-friendly websites using HTML,
            CSS, Bootstrap, and JavaScript.
          </p>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
