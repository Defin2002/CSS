<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Course Progress Dashboard</title>

  <!-- Bootstrap CSS -->
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

  <style>

    body{
      background:#f4f4f4;
      font-family:Arial, Helvetica, sans-serif;
    }

    .dashboard-box{
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .progress{
      height:30px;
      margin-bottom:25px;
      border-radius:10px;
    }

    .progress-bar{
      font-weight:bold;
      font-size:15px;
    }

  </style>

</head>

<body>

  <div class="container py-5">

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="dashboard-box">

          <!-- Breadcrumb -->
          <nav class="mb-4">

            <ol class="breadcrumb">

              <li class="breadcrumb-item">

                <a href="#">
                  Home
                </a>

              </li>

              <li class="breadcrumb-item">

                <a href="#">
                  Courses
                </a>

              </li>

              <li class="breadcrumb-item active">

                Web Development

              </li>

            </ol>

          </nav>

          <!-- Heading -->
          <h1 class="mb-5">

            Web Development Course

            <span class="badge bg-danger">

              New

            </span>

          </h1>

          <!-- HTML -->
          <h5>HTML - 100%</h5>

          <div class="progress">

            <div
            class="progress-bar bg-success progress-bar-striped"
            style="width:100%;">

              100% Complete

            </div>

          </div>

          <!-- CSS -->
          <h5>CSS - 75%</h5>

          <div class="progress">

            <div
            class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
            style="width:75%;">

              75% Complete

            </div>

          </div>

          <!-- JavaScript -->
          <h5>JavaScript - 50%</h5>

          <div class="progress">

            <div
            class="progress-bar bg-warning"
            style="width:50%;">

              50% Complete

            </div>

          </div>

          <!-- Bootstrap -->
          <h5>Bootstrap - 25%</h5>

          <div class="progress mb-5">

            <div
            class="progress-bar bg-danger"
            style="width:25%;">

              25% Complete

            </div>

          </div>

          <!-- Button Group -->
          <div
          class="btn-group mb-5">

            <button
            class="btn btn-success">

              Start

            </button>

            <button
            class="btn btn-warning">

              Pause

            </button>

            <button
            class="btn btn-danger">

              Reset

            </button>

          </div>

          <!-- Pagination -->
          <nav>

            <ul class="pagination">

              <!-- Active -->
              <li class="page-item active">

                <a class="page-link" href="#">
                  1
                </a>

              </li>

              <!-- Normal -->
              <li class="page-item">

                <a class="page-link" href="#">
                  2
                </a>

              </li>

              <!-- Disabled -->
              <li class="page-item disabled">

                <a class="page-link" href="#">
                  3
                </a>

              </li>

            </ul>

          </nav>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
