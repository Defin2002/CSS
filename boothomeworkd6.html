<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Bakery Feedback Form</title>

  <!-- Bootstrap CSS -->
  <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

  <!-- Main Container -->
  <div
  class="container d-flex justify-content-center align-items-center vh-100">

    <!-- Card -->
    <div
    class="card shadow-lg border-0 rounded-4 w-50">

      <!-- Card Body -->
      <div class="card-body p-5">

        <!-- Heading -->
        <h2 class="text-center text-danger fw-bold mb-4">

          <i class="bi bi-cake2-fill"></i>

          Bakery Feedback Form

        </h2>

        <!-- Form -->
        <form>

          <!-- Name -->
          <div class="mb-3">

            <label
            for="name"
            class="form-label">

              Customer Name

            </label>

            <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter your name"
            required>

          </div>

          <!-- Email -->
          <div class="mb-3">

            <label
            for="email"
            class="form-label">

              Email Address

            </label>

            <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email"
            required>

          </div>

          <!-- Feedback -->
          <div class="mb-3">

            <label
            for="feedback"
            class="form-label">

              Feedback Message

            </label>

            <textarea
            class="form-control"
            id="feedback"
            rows="4"
            placeholder="Write your feedback here..."
            required></textarea>

          </div>

          <!-- Contact Method -->
          <div class="mb-3">

            <label class="form-label">

              Preferred Contact Method

            </label>

            <div class="form-check">

              <input
              class="form-check-input"
              type="radio"
              name="contact"
              id="emailContact">

              <label
              class="form-check-label"
              for="emailContact">

                Email

              </label>

            </div>

            <div class="form-check">

              <input
              class="form-check-input"
              type="radio"
              name="contact"
              id="phoneContact">

              <label
              class="form-check-label"
              for="phoneContact">

                Phone

              </label>

            </div>

          </div>

          <!-- Satisfaction -->
          <div class="mb-4">

            <label
            for="range"
            class="form-label">

              Satisfaction Level (1–10)

            </label>

            <input
            type="range"
            class="form-range"
            min="1"
            max="10"
            id="range">

          </div>

          <!-- Dropdown -->
          <div class="mb-4">

            <label
            for="order"
            class="form-label">

              Order Type

            </label>

            <select
            class="form-select"
            id="order">

              <option selected>

                Choose Order Type

              </option>

              <option>

                Cake

              </option>

              <option>

                Cookies

              </option>

              <option>

                Pastries

              </option>

            </select>

          </div>

          <!-- Submit Button -->
          <button
          type="submit"
          class="btn btn-danger w-100 fw-bold">

            Submit Feedback

          </button>

        </form>

      </div>

    </div>

  </div>

</body>
</html>
