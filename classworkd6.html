<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="icon" 
   type="image/svg+xml" 
   href="https://www.svgrepo.com/show/303214/nike-4-logo.svg">
<style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
      background-color: black;
    
    }
.card{
      width:300px;
      background:white;
      padding:20px;
      border-radius:12px;
      text-align:left;
      box-shadow:0 4px 10px rgba(50, 220, 31, 0.2);

    }
     .product-img{
      width:100%;
      height:220px;
      object-fit:cover;

      /* 2px solid black border */
      border:2px solid rgb(0, 0, 0);

      /* Round only top-left & bottom-right */
      border-top-left-radius:25px;
      border-bottom-right-radius:25px;
    }
     h2{
      margin-top:15px;
      font-size:28px;
    }
    p{
      margin:10px 0;
      font-size:18px;
      color:#555;
    }
    button{
      padding:10px 20px;
      border:none;
      background:black;
      color:white;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
    }
    button :hover{
        background-color: red;
    }
   @media (max-width:600px){

      .card{
        text-align:center;
      }

      h2{
        font-size:22px;
      }

      p{
        font-size:14px;
      }

      button{
        font-size:14px;
      }
    }
 @media (orientation:landscape){

      .card{
        background:rgb(205, 242, 242);
      }
    }
</style>
</head>
<body>
    <div class="card">
        <img 
      src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
      alt="Shoes"
      class="product-img"
    >
     <h2>Running Shoes</h2>
    <p>Comfortable and stylish shoes for daily use.</p>
    <a href="https://www.nike.in/"><button>Buy Now</button></a>
    </div>
</body>
</html>
