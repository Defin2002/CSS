<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Food Delivery Service</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body{
      font-family: Arial, Helvetica, sans-serif;
      background-color:#f8f9fa;
    }

    /* Header */
    header{
      background-color:#ff6600;
      color:white;
      padding:15px 0;
    }

    .nav-links a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-weight:bold;
    }

    /* Main Section */
    .main-section{
      padding:50px 0;
    }

    .food-img{
      width:100%;
      border-radius:10px;
    }

    /* Footer */
    footer{
      background-color:#222;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:30px;
    }

  </style>
</head>
<body>

  <!-- Header -->
  <header>

    <div class="container">

      <div class="row align-items-center">

        <!-- Brand Name -->
        <div class="col-6">
          <h2>FoodExpress</h2>
        </div>

        <!-- Navigation -->
        <div class="col-6 text-end nav-links">
          <a href="#">Home</a>
          <a href="#">Contact</a>
        </div>

      </div>

    </div>

  </header>

  <!-- Main Section -->
  <section class="main-section">

    <div class="container">

      <div class="row align-items-center">

        <!-- Left Column -->
        <div class="col-md-8 mb-4">

          <h1>Fast & Fresh Food Delivery</h1>

          <p>
            Welcome to FoodExpress! We deliver delicious meals
            directly to your doorstep quickly and safely.
            Enjoy your favorite foods anytime, anywhere.
          </p>

        </div>

        <!-- Right Column -->
        <div class="col-md-4">

          <img
            src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"
            alt="Food Image"
            class="food-img"
          >

        </div>

      </div>

    </div>

  </section>
  <br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
  <!-- Footer -->
  <footer>
    <p>© 2026 FoodExpress. All Rights Reserved.</p>
  </footer>

</body>
</html>
